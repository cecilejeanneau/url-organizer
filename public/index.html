<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>URL Organizer</title>
  <link rel="stylesheet" href="./css/app.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='50' font-size='50'%3E%F0%9F%94%97%3C/text%3E%3C/svg%3E" />
  <style>
    input[type="color"] { -webkit-appearance: none; appearance: none; }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; }
    input[type="color"]::-moz-color-swatch { border: none; }
  </style>
</head>
<body class="m-0 bg-gradient-to-b from-slate-50 to-slate-100 text-slate-900 antialiased" x-data="urlOrganizerApp" x-init="init()">
  <main class="mx-auto my-5 max-w-[1320px] px-4 pb-8">
    <header>
      <h1 class="m-0 flex items-center gap-2 text-3xl font-bold tracking-tight">
        <span class="material-symbols-rounded text-3xl leading-none">link</span>
        URL Organizer
      </h1>
      <p class="mt-1 text-sm text-slate-600">MongoDB-backed: per-link names, categories, and delete actions.</p>
    </header>

    <section class="mt-4 flex flex-wrap items-center gap-2 rounded-xl border border-slate-200 bg-white p-3 shadow-sm">
      <label class="inline-flex items-center gap-2 rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-medium hover:bg-slate-50 cursor-pointer" title="Import local URLs file" aria-label="Import local URLs file">
        <span class="material-symbols-rounded text-base leading-none">download</span>
        <span x-text="isImporting ? 'Importing...' : 'Import local URLs file'"></span>
        <input type="file" accept=".md" @change="importFromSelectedFile($event)" class="hidden" />
      </label>

      <input
        type="text"
        placeholder="Search by name, URL, or domain"
        class="w-[300px] rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none ring-sky-300 focus:ring"
        x-model="search"
      />

      <select
        title="categories"
        class="rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none ring-sky-300 focus:ring"
        x-model="categoryFilter"
      >
        <option value="">All categories</option>
        <template x-for="category in categoryOptions()" :key="category.persistedName">
          <option :value="category.name" x-text="`${category.name} (${category.count})`"></option>
        </template>
      </select>

      <span class="ml-auto rounded-full border border-sky-200 bg-sky-100 px-3 py-1.5 text-sm font-semibold text-sky-800" x-text="`${visibleCount()} URLs`"></span>
    </section>

    <section class="mt-3 rounded-xl border border-slate-200 bg-white p-3 shadow-sm">
      <h2 class="m-0 text-lg font-semibold">Categories</h2>

      <div class="mt-2 grid gap-2 md:grid-cols-[minmax(180px,260px)_90px_70px_140px]">
        <input
          type="text"
          placeholder="Category name"
          class="rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none ring-sky-300 focus:ring"
          x-model="newCategoryName"
        />
        <div class="relative">
          <button
            type="button"
            @click="newCategoryPickerOpen = !newCategoryPickerOpen"
            class="flex items-center justify-center gap-2 rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm"
            title="Icon"
          >
            <span class="material-symbols-rounded text-base leading-none" x-text="newCategoryIcon"></span>
          </button>
          <div
            x-show="newCategoryPickerOpen"
            @click.away="newCategoryPickerOpen = false"
            class="absolute left-0 z-20 mt-2 w-48 rounded bg-white border p-2 shadow"
          >
            <div class="grid grid-cols-5 gap-2">
              <template x-for="icon in ['folder','link','star','bookmark','label','home','work','school','favorite','shopping_bag']" :key="icon">
                <button type="button" @click="newCategoryIcon = icon; newCategoryPickerOpen = false" class="p-2 rounded hover:bg-slate-100">
                  <span class="material-symbols-rounded text-lg leading-none" x-text="icon"></span>
                </button>
              </template>
            </div>
          </div>
        </div>
        <input
          type="color"
          title="Color"
          class="h-10 w-10 rounded-full cursor-pointer"
          x-model="newCategoryColor"
        />
        <button
          class="inline-flex items-center gap-2 rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-medium hover:bg-slate-50"
          @click="createCategory()"
        >
          <span class="material-symbols-rounded text-base leading-none">add_circle</span>
          <span>Add category</span>
        </button>
      </div>

      <div class="mt-2 flex flex-col gap-2">
        <template x-for="category in categories" :key="category.persistedName">
          <div class="grid items-center gap-2 rounded-lg border border-slate-200 bg-slate-50 p-2 md:grid-cols-[minmax(160px,1fr)_80px_64px_90px_90px]">
            <input class="rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none ring-sky-300 focus:ring" type="text" placeholder="Name" x-model="category.name" />
            <div class="relative">
              <button type="button" @click="category._pickerOpen = !category._pickerOpen" class="rounded-lg border border-slate-300 px-3 py-2 text-center text-sm bg-white">
                <span class="material-symbols-rounded text-base leading-none" x-text="category.icon" :style="`color: ${category.color}`"></span>
              </button>
              <div x-show="category._pickerOpen" @click.away="category._pickerOpen = false" class="absolute left-0 z-20 mt-2 w-48 rounded bg-white border p-2 shadow" style="display:none">
                <div class="grid grid-cols-5 gap-2">
                  <template x-for="icon in ['folder','link','star','bookmark','label','home','work','school','favorite','shopping_bag']" :key="icon">
                    <button type="button" @click="category.icon = icon; category._pickerOpen = false" class="p-2 rounded hover:bg-slate-100">
                      <span class="material-symbols-rounded text-lg leading-none" x-text="icon"></span>
                    </button>
                  </template>
                </div>
              </div>
            </div>
            <input class="h-10 w-10 rounded-full border-0 cursor-pointer" type="color" title="Color" x-model="category.color" />
            <span class="text-right text-xs text-slate-500" x-text="`${category.count} URLs`"></span>
            <button class="inline-flex items-center justify-center gap-1 rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-medium hover:bg-slate-100" @click="saveCategory(category)">
              <span class="material-symbols-rounded text-base leading-none">check</span>
              <span>Save</span>
            </button>
          </div>
        </template>
      </div>
    </section>

    <section class="mt-3 overflow-x-auto rounded-xl border border-slate-200 bg-white p-3 shadow-sm">
      <h2 class="m-0 text-lg font-semibold">URLs</h2>
      <table class="mt-2 w-full border-collapse">
        <thead>
          <tr>
            <th class="border-b border-slate-200 px-2 py-2 text-left text-xs font-semibold uppercase tracking-wide text-slate-600">Name</th>
            <th class="border-b border-slate-200 px-2 py-2 text-left text-xs font-semibold uppercase tracking-wide text-slate-600">URL</th>
            <th class="border-b border-slate-200 px-2 py-2 text-left text-xs font-semibold uppercase tracking-wide text-slate-600">Category</th>
            <th class="border-b border-slate-200 px-2 py-2 text-left text-xs font-semibold uppercase tracking-wide text-slate-600"></th>
          </tr>
        </thead>
        <tbody>
          <template x-for="item in filteredItems()" :key="item.id">
            <tr>
              <td class="border-b border-slate-100 px-2 py-2 align-top">
                <input
                  class="w-full min-w-[170px] rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none ring-sky-300 focus:ring"
                  type="text"
                  placeholder="Link name"
                  x-model="item.name"
                  @input.debounce.450ms="saveUrlName(item)"
                />
              </td>
              <td class="border-b border-slate-100 px-2 py-2 align-top">
                <a :href="item.url" target="_blank" rel="noreferrer" class="break-all text-sky-800 hover:underline" x-text="item.url"></a>
                <small class="mt-1 block text-xs text-slate-500" x-text="item.host"></small>
                <template x-if="categoryMeta(item.category)">
                  <span
                    class="mt-2 inline-flex items-center gap-1 rounded-full border bg-white/70 px-2 py-0.5 text-xs font-medium"
                    :style="`border-color:${categoryMeta(item.category)?.color};color:${categoryMeta(item.category)?.color}`"
                  >
                    <span class="material-symbols-rounded" x-text="categoryMeta(item.category)?.icon"></span>
                    <span class="ml-1" x-text="categoryMeta(item.category)?.name"></span>
                  </span>
                </template>
              </td>
              <td class="border-b border-slate-100 px-2 py-2 align-top">
                <select
                  class="w-full min-w-[170px] rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none ring-sky-300 focus:ring"
                  title="Category"
                  x-model="item.category"
                  @change="updateUrlCategory(item)"
                >
                  <option value="">Uncategorized</option>
                  <template x-for="category in categoryOptions()" :key="category.persistedName">
                    <option :value="category.name" x-text="`${category.icon} ${category.name}`"></option>
                  </template>
                </select>
              </td>
              <td class="border-b border-slate-100 px-2 py-2 align-top">
                <button
                  class="inline-flex h-9 w-9 items-center justify-center rounded-full border border-rose-200 text-rose-700 transition hover:-translate-y-px hover:bg-rose-100"
                  title="Delete"
                  type="button"
                  aria-label="Delete URL"
                  @click="deleteUrl(item)"
                >
                  <span class="material-symbols-rounded leading-none">delete</span>
                </button>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </section>
  </main>

  <div
    class="pointer-events-none fixed bottom-5 right-5 z-[1000] max-w-[340px] translate-y-2 rounded-xl px-4 py-3 text-sm font-medium text-white opacity-0 shadow-2xl transition duration-200"
    :class="{
      'hidden': !toastVisible,
      'opacity-100 translate-y-0': toastVisible,
      'bg-emerald-700': toastType === 'success',
      'bg-rose-700': toastType === 'error',
      'bg-slate-900': toastType === 'info'
    }"
    role="status"
    aria-live="polite"
    x-text="toastMessage"
  ></div>

  <script type="module">
    import Alpine from './vendor/alpine.esm.js';
    import { createUrlOrganizerStore } from './js/store/urlOrganizerStore.js';

    Alpine.data('urlOrganizerApp', createUrlOrganizerStore);
    window.Alpine = Alpine;
    Alpine.start();
  </script>
</body>
</html>
